<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="all" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no"
    />
    <meta name="author" content="Tencent-TGideas" />
    <meta name="Copyright" content="Tencent" />
    <meta
      name="Description"
      content="腾讯游戏是腾讯四大网络平台之一，是全球领先的游戏开发和运营机构，也是国内最大的网络游戏社区。无论是腾讯公司整体的在线生活模式布局，还是腾讯游戏的产品布局，都是从用户的最基本需求、最简单应用入手，注重产品的可持续发展和长久生命力，打造绿色健康的精品游戏。在开放性的发展模式下，腾讯游戏采取内部自主研发和多元化的外部合作两者结合的方式，已经在网络游戏的多个细分市场领域形成专业化布局并取得良好的市场业绩。"
    />
    <meta
      name="Keywords"
      content="腾讯游戏,Tencent Games,腾讯游戏嘉年华,Tencent Games Carnival,腾讯游戏竞技平台,Tencent Games Arena,腾讯游戏公会,Tencent Games Guild,腾讯游戏爱心联盟,Tencent Games Social Responsibility,腾讯游戏公益,Tencent Games Social Responsibility,腾讯小游戏,腾讯网页游戏,腾讯QQ游戏,QQ小游戏,QQ网页游戏,QQ腾讯游戏,腾讯网游,腾讯网络游戏,腾讯大型网游,腾讯大型网络游戏,腾讯游戏平台,QQ游戏平台"
    />
    <title><%= title %></title>
    <style type="text/css">
      /*==========基本样式==========*/
      body,
      div,
      h1,
      h2,
      h3,
      h4,
      form,
      img,
      ul,
      ol,
      li,
      dl,
      dt,
      dd,
      p {
        margin: 0;
        padding: 0;
      }
      li {
        list-style: none;
      }
      h1,
      h2,
      h3,
      h4 {
        font-size: 100%;
      }
      img {
        border: 0;
      }
      table {
        border-collapse: collapse;
      }
      a {
        color: #666666;
        text-decoration: none;
        outline: none;
      }
      a:hover {
        color: #f00;
        text-decoration: none;
      }
      html {
        height: 100%;
      }

      /*清除浮动*/
      * html .q {
        height: 1%;
      }
      * + html .q {
        height: 1%;
      }
      .q:after {
        content: '';
        display: block;
        height: 0;
        clear: both;
        overflow: hidden;
      }
      .clear {
        clear: both;
        height: 0px;
        overflow: hidden;
      }
      .hidden {
        display: none;
      }
      body {
        min-height: 100%;
        font-size: 14px;
        color: #444;
        background-color: #f1f1f1;
        font-family: Verdana, 微软雅黑;
      }
      .wrap {
        background: #f1f1f1
          url(https://ossweb-img.qq.com/images/game/portal2012/colorBelt1.jpg)
          repeat-x 50% 0;
      }
      #header {
        max-width: 1000px;
        margin: 0 auto;
        padding: 36px 0 0;
      }
      #header h1 {
        max-width: 1000px;
        height: 160px;
        margin: 0 auto;
        padding-top: 20px;
        background: #ffffff
          url(https://ossweb-img.qq.com/images/game/brand/contract_logo.jpg)
          no-repeat 42px 20px;
      }
      #header a {
        display: block;
        width: 172px;
        height: 53px;
        overflow: hidden;
        text-indent: -9999px;
        margin: 0 0 0 42px;
      }
      .content {
        width: 920px;
        margin: -105px auto 0;
        padding: 0 40px 40px;
        background: #fff;
        line-height: 26px;
        word-break:break-all;
        /* line-break: anywhere; */
      }
      .content h2 {
        height: 40px;
        line-height: 40px;
        padding: 0 0 25px;
        margin: 0 0 25px;
        font-size: 30px;
        line-height: 40px;
        font-weight: normal;
        text-align: center;
        border-bottom: 1px solid #d1d1d1;
      }
      .content h3 {
        margin: 20px 0 5px;
        font-weight: bold;
      }
      .content h4 {
        font-weight: bold;
      }
      .content p {
      }
      .content a {
        text-decoration: underline;
      }
      .content .udl {
        text-decoration: underline;
      }
      .content a:hover {
        color: #f00;
        text-decoration: underline;
      }
      .author {
        padding: 10px 0;
        text-align: right;
        font-weight: bold;
      }
      #footer_ieg {
        height: 146px;
        text-align: center;
        font-size: 12px;
        line-height: 19px;
      }
      .sub {
        text-indent: 2em;
      }
      .wrap_ieg {
        margin: 0 auto;
        padding: 20px 0 0;
        color: #666666;
      }
      .wrap_ieg p a {
        color: #666666;
      }
      .wrap_ieg p a:hover {
        color: #f00;
      }
      #footer_ieg p.e {
        margin-top: -4px;
        font-size: 10px;
      }
      .langP {
        text-align: right;
      }
      .langP span {
        padding: 0 10px;
      }
      .langP a.on {
        font-weight: bold;
        cursor: default;
      }
      .pri_section {
        margin-top: 100px;
      }

      @media screen and (max-width: 1000px) {
        .content {
          padding: 0 5%;
          width: 90%;
        }
      }
      @media screen and (max-width: 420px) {
        .content h2 {
          font-size: 18px;
          font-weight: bold;
          letter-spacing: -1px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div id="header">
        <h1><a href="/" title="腾讯游戏">腾讯游戏</a></h1>
      </div>
      <div class="content">
        <%= content %>
      </div>
      <div id="afooter"></div>
    </div>
    <script src="//ossweb-img.qq.com/images/js/PTT/ping_tcss_tgideas_https_min.js"></script>
    <script src="//game.gtimg.cn/images/js/2018foot/foot.js"></script>
    <script>
      //此段代码不能放到外链JS中，不能是变量，<a  href="//mosso.oa.com/">MOSSO系统</a>需要爬本页面内的代码以得到页面属性
      var setSite = {
        //设置网站属性
        siteType: 'privacy', //必填项:"os"代表是官网，如果不是，则填写actName例如a20160701xxx
        pageType: 'page', //必填项:本页面的定位；按照页面含义填写例如main||list||detail||download||share||page1||pageN
        pageName: '腾讯游戏隐私保护指引', //必填项:页面中文名
        project: 'other', //选填项:如果是官网模块则是必填;按照模块内容，填写固定的对应值;原生官网base;微社区ingame;同人站doujin;赛事match;故事站story;文化站history;粉丝站fans;爆料站coming;论坛bbs;默认other;
        osact: 0, //选填项:是否是官网专题(在官网运营的专题)boolean；默认是0；可以在链接上加入参数osact=1来灵活设置
      };
      if (typeof pgvMain == 'function') pgvMain(); //千万不能忘记！
    </script>
  </body>
</html>
